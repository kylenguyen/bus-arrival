name: bus-arrival image

on:
  push:
    branches: [main]
    # docs/manifest-only pushes still rebuild: the tag is what the cluster
    # pulls, so a skipped build would leave :latest pointing at an older tree.
  workflow_dispatch:

concurrency:
  # A second push to main while the first is still building would race on the
  # :latest tag; last writer should win, and the loser is wasted work.
  group: bus-arrival-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # amd64 + arm64 so the same tag runs on an x86 node or a Pi/ARM node
      # without pinning per-arch tags in the manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry itself; the alternative (GHA cache) is
          # evicted per-branch and gives worse hit rates on a single-branch repo.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
