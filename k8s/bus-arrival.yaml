apiVersion: v1
kind: Namespace
metadata:
  name: ezbus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-arrival
  namespace: ezbus
  labels:
    app: bus-arrival
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-arrival
  template:
    metadata:
      labels:
        app: bus-arrival
    spec:
      securityContext:
        runAsNonRoot: true
        # Explicit uid/gid rather than trusting the image's `USER node`: without
        # these, runAsNonRoot only fails *after* the kubelet resolves the image,
        # and a future base-image change to root would break the pod at admission
        # time instead of here. 1000 is `node` in node:22-slim.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bus-arrival
        # Built and pushed by .github/workflows/bus-arrival.yml on every push to
        # main. Multi-arch (amd64 + arm64), so the same tag runs on an Apple
        # Silicon k3s VM and an x86 node. Deploy a new build with:
        #   kubectl -n ezbus rollout restart deployment/bus-arrival
        # Roll back by pinning the SHA tag that workflow also pushes:
        #   kubectl -n ezbus set image deployment/bus-arrival bus-arrival=ghcr.io/kylenguyen/bus-arrival:<sha>
        image: ghcr.io/kylenguyen/bus-arrival:latest
        # Required, not incidental: a moving tag with IfNotPresent would keep
        # serving whatever the node cached the first time and silently ignore
        # every rebuild.
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        # V8 sizes its old space from the host's RAM, not the cgroup limit, so on
        # a large node it will happily plan for more than the 512Mi limit below
        # and get OOM-killed instead of collecting. Harmless while the heap was
        # tiny; the address index makes it ~35Mi long-lived plus a transient
        # spike at startup. 384Mi leaves room for the rest of the RSS.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=384"
        - name: LTA_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: lta-datamall
              key: accountKey
              # Absent secret => the app boots in mock mode instead of
              # crash-looping. Remove `optional` once the key is in place so a
              # missing secret fails loudly rather than serving fake timings.
              optional: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        # Deliberately a TCP check, not /healthz: a DataMall outage should not
        # restart-loop a pod that is still serving cached timings fine.
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bus-arrival-svc
  namespace: ezbus
spec:
  selector:
    app: bus-arrival
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
# Own hostname, so no stripPrefix or trailing-slash middleware is needed and
# asset paths resolve against the root.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bus-arrival-ingress
  namespace: ezbus
spec:
  # k3s bundles Traefik as the only controller. Naming it explicitly instead of
  # relying on the default-class annotation keeps the manifest working on a
  # cluster where another controller was installed later and took the default.
  ingressClassName: traefik
  rules:
  # Local k3s: *.localhost resolves to 127.0.0.1 without touching /etc/hosts on
  # macOS and every current browser, so this host works as soon as Traefik's
  # LoadBalancer is reachable on port 80.
  - host: bus.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bus-arrival-svc
            port:
              number: 80
  # Public route via the tunnel. Requires ezbus.sg as a CNAME to it — an apex
  # CNAME, so it depends on Cloudflare's flattening; harmless on a local
  # cluster, where nothing ever sends that Host header. Apex only: www.ezbus.sg
  # is not served here and needs a redirect at the Cloudflare edge if wanted.
  - host: ezbus.sg
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bus-arrival-svc
            port:
              number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-ezbus
  namespace: ezbus # Must match the secret's namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-ezbus
  template:
    metadata:
      labels:
        app: cloudflared-ezbus
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: ezbus-tunnel-token
              key: token
