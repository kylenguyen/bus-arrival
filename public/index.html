<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tints the browser chrome so the page does not end at a white seam. -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Live bus arrival times for the stops nearest you." />
    <title>Bus Arrivals</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚍</text></svg>"
    />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-row">
        <h1>Bus Arrivals</h1>
        <button id="search-toggle" type="button" class="ghost" aria-expanded="false">
          Search
        </button>
      </div>
      <p class="tagline" id="tagline">Stops nearest you, live from LTA</p>
    </header>

    <main>
      <section class="finder" id="finder" aria-label="Find a bus stop" hidden>
        <label class="visually-hidden" for="search">Search bus stops</label>
        <input
          id="search"
          type="search"
          inputmode="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Stop code or name, e.g. 43179 or Toa Payoh"
        />
        <ul id="results" class="results" hidden></ul>
        <p id="finder-note" class="note" hidden></p>
      </section>

      <!-- Location state: prompt, denial, retry. Hidden once the board loads. -->
      <section id="gate" class="gate" hidden>
        <p id="gate-msg" class="gate-msg"></p>
        <button id="gate-action" type="button" class="primary" hidden></button>
      </section>

      <section id="board" class="board" aria-live="polite" aria-label="Nearby bus stops"></section>
    </main>

    <footer class="footer">
      <span id="status">—</span>
      <span class="dot">·</span>
      <span>* scheduled, not tracked</span>
      <span class="dot">·</span>
      <span>Data © LTA, via DataMall</span>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
