<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tints the browser chrome so the page does not end at a white seam.
         These two duplicate `--bg` in each scheme and cannot read a CSS variable.
         Keep them in step with the token blocks at the top of styles.css. -->
    <meta name="theme-color" content="#e7ebe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Next buses at this Singapore bus stop, live from LTA, plus today's first and last bus." />
    <!-- Server-injected meta. The four tags below are the replacement targets:
         `/stop/:code` in src/index.ts swaps each whole tag, by exact string
         match, for a per-stop version when the code is a known stop. The tokens
         are the generic tags themselves rather than `__STOP_TITLE__`-style
         markers, so this file served unreplaced — by express.static, or for an
         unknown code — is already valid, sensibly generic HTML with no marker
         text to leak into a tab title: a junk URL declares the homepage its
         canonical and stays out of the index. Edit one of these tags and its
         constant in src/index.ts in the same commit, or the injection silently
         stops. -->
    <title>bus stop arrivals · ezbus</title>
    <meta property="og:title" content="bus stop arrivals · ezbus" />
    <meta property="og:description" content="Next buses now, live from LTA · first & last bus today" />
    <meta property="og:url" content="https://ezbus.sg/stop" />
    <link rel="canonical" href="https://ezbus.sg/" />
    <!-- Static additions, never replaced — injection only targets the four tags above. -->
    <meta property="og:site_name" content="ezbus" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_SG" />
    <meta property="og:image" content="https://ezbus.sg/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fetched in parallel with stop.js, which imports them, rather than after.
         route-logic.js (for the shared haversine) itself imports origin.js, so
         all three pure modules are named here. -->
    <link rel="modulepreload" href="/origin.js" />
    <link rel="modulepreload" href="/route-logic.js" />
    <link rel="modulepreload" href="/stop-logic.js" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- Same reasoning as index.html: preloaded so the stencilled stop code
         swaps at first paint rather than a beat after it. `crossorigin` is
         required even same-origin — fonts always fetch in CORS mode. -->
    <link
      rel="preload"
      href="/fonts/archivo-narrow-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230a6a72'/><g fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'><rect x='6' y='7' width='20' height='14' rx='3'/><path d='M6 14h20'/></g><g fill='%23ffffff'><circle cx='11' cy='24' r='2'/><circle cx='21' cy='24' r='2'/></g></svg>"
    />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-row">
        <!-- Same wordmark as the board, but a link: on this page it is the way
             back as well as the name, and the board is one tap away wherever
             you are on the stop page. A paragraph, not the heading-1 the other
             shells use: this page's h1 is the stop name on the plate below,
             injected by the server and rebuilt by stop.js. -->
        <p class="wordmark"><a href="/" aria-label="ezbus — back to the arrivals board"><span class="mark-ez">ez</span><span>bus</span></a></p>
      </div>
    </header>

    <main class="stop-main">
      <p class="back"><a href="/">← Back to board</a></p>

      <!-- Server-swapped body regions. The three single-line blocks below —
           #sp-plate, #sp-sched and #sp-nearby — are replacement targets exactly
           like the head tags above: /stop/:code swaps each whole block, by
           exact string match against the *_TARGET constants in
           src/stop-page.ts, for the stop's static plate, schedule and
           neighbours when the code is known. Served unreplaced this is today's
           generic wait state. Keep each block on one line, and edit a block and
           its constant in the same commit, or the injection silently stops. -->

      <!-- The flag plate: code, name, road, distance, pin, share, opposite.
           For a known stop the server renders the real plate (title block as
           the page h1); stop.js rewrites it — identically — once /api/stop
           lands. Unknown codes keep the skeleton until the guard renders. -->
      <div id="sp-plate"><div class="card sp-plate skeleton" aria-hidden="true"><div class="card-head"><div class="card-title"><span class="sk sk-code"></span><span class="sk sk-name"></span><span class="sk sk-sub"></span></div></div></div></div>

      <!-- The arrivals board for this one stop — or the guard, when the code in
           the URL is not a stop. Skeleton rows at the arrivals grid's own size,
           so nothing jumps when the timings land. Never server-swapped: live
           arrivals are client-rendered only, so a cached page can never show a
           stale timing. -->
      <section id="sp-arrivals" aria-label="Next buses at this stop">
        <noscript><p class="card-msg">Live arrival times need JavaScript. The first &amp; last bus table below works without it.</p></noscript>
        <div class="card skeleton" aria-hidden="true">
          <div class="sk-row"><span class="sk sk-no"></span><span class="sk sk-eta"></span></div>
          <div class="sk-row"><span class="sk sk-no"></span><span class="sk sk-eta"></span></div>
          <div class="sk-row"><span class="sk sk-no"></span><span class="sk sk-eta"></span></div>
        </div>
      </section>

      <!-- "Today at this stop". For a known stop the server renders the static
           first/last table (all three day-types); stop.js replaces it with the
           interactive day-toggle version once /api/stop lands. -->
      <section id="sp-sched" aria-label="Today at this stop"></section>

      <!-- Nearby stops plus JSON-LD for a known stop; this generic sentence
           otherwise. stop.js never touches this section. -->
      <section id="sp-nearby"><p class="card-msg">Looking for live bus arrival times? <a href="/">Open the ezbus board</a> to see every stop near you.</p></section>
    </main>

    <footer class="footer">
      <span id="status">—</span>
      <span class="dot">·</span>
      <span>* scheduled, not tracked</span>
      <span class="dot">·</span>
      <span>Data © LTA, via DataMall</span>
      <span class="dot">·</span>
      <a href="/buses">all bus services</a>
    </footer>

    <script src="/stop.js" type="module"></script>
  </body>
</html>
